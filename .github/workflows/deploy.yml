name: DEPLOY

on:
  # Sent by the upstream presserl pipeline after each image build, with the image version
  repository_dispatch:
    types: [presserl-image]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (X.Y.Z); empty = latest upstream release tag'
        required: false
        type: string
  push:
    branches:
      - 'master'
      - 'main'

jobs:
  version:
    name: Resolve version 🔍
    runs-on: ubuntu-latest
    outputs:
      major_version: ${{ steps.split.outputs.major_version }}
      minor_version: ${{ steps.split.outputs.minor_version }}
      build_version: ${{ steps.split.outputs.build_version }}
      skip: ${{ steps.split.outputs.skip }}
    steps:
      - id: split
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          VERSION="$REQUESTED"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh api repos/UnterrainerInformatik/presserl/tags --jq '[.[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
          fi
          if [ -z "$VERSION" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "No upstream release yet; nothing to deploy." >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No valid version (got '$VERSION')" >&2
            exit 1
          fi
          echo "Deploying $VERSION"
          echo "major_version=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor_version=$(echo $VERSION | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "build_version=$(echo $VERSION | cut -d. -f3)" >> $GITHUB_OUTPUT

  deploy:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: UnterrainerInformatik/deploy-workflow/.github/workflows/workflow.yml@master
    with:
      major_version: ${{ needs.version.outputs.major_version }}
      minor_version: ${{ needs.version.outputs.minor_version }}
      build_version: ${{ needs.version.outputs.build_version }}
    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      DATA_DIR: ${{ secrets.DATA_DIR }}
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      WG_CONFIG: ${{ secrets.WG_CONFIG }}
